[package]
name = "copperforge-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "CopperForge internals (panels, gerber/BOM/3D, services)"

# This is a library crate — don't generate a cargo-dist installer for it
# (no binary to install). Only the top-level `copperforge` package ships.
[package.metadata.dist]
dist = false

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
egui-file-dialog = { workspace = true }

# Image and graphics handling
egui_extras = { workspace = true }
image = { workspace = true }

# Gerber and PCB handling
gerber_viewer = { workspace = true }
gerber_types = { workspace = true }
gerber_parser = { workspace = true }
lyon = { workspace = true }
nalgebra = { workspace = true }

# 3D renderer
glow = { workspace = true }
egui_glow = { workspace = true }
bytemuck = { workspace = true }

# Egui Mobius framework
egui_mobius_reactive = { workspace = true }

# Citizen panel lifecycle
egui_citizen = { workspace = true }

# KiCad file parsing (BOM extraction)
kiparse = { workspace = true }

# Logging and configuration
env_logger = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
egui_dock = { workspace = true }

regex = { workspace = true }
once_cell = { workspace = true }



# Project database (embedded pure-Rust KV store)
redb = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }

# Tree view
egui_ltreeview = { workspace = true }

# Release archives (gerber+drill zip)
zip = { workspace = true }

# XLSX BOM export
rust_xlsxwriter = { workspace = true }

# In-app shell parsing.
clap = { workspace = true }
shlex = { workspace = true }

# HTTP client for the cuforge-services health poller.
ureq = { workspace = true }