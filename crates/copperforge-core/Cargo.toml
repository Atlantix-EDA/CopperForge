[package]
name = "copperforge-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "CopperForge internals (panels, gerber/BOM/3D, services)"

# This is a library crate — don't generate a cargo-dist installer for it
# (no binary to install). Only the top-level `copperforge` package ships.
[package.metadata.dist]
dist = false

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
egui-file-dialog = { workspace = true }

# Image and graphics handling
egui_extras = { workspace = true }
image = { workspace = true }

# Gerber and PCB handling
gerber_viewer = { workspace = true }
gerber_types = { workspace = true }
gerber_parser = { workspace = true }
lyon = { workspace = true }
nalgebra = { workspace = true }

# 3D renderer
glow = { workspace = true }
egui_glow = { workspace = true }
bytemuck = { workspace = true }

# Egui Mobius framework
egui_mobius_reactive = { workspace = true }

# Citizen panel lifecycle
egui_citizen = { workspace = true }

# KiCad file parsing (BOM extraction)
kiparse = { workspace = true }

# Logging and configuration
env_logger = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
egui_dock = { workspace = true }

regex = { workspace = true }
once_cell = { workspace = true }



# Project database (embedded pure-Rust KV store)
redb = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }

# Tree view
egui_ltreeview = { workspace = true }

# Release archives (gerber+drill zip)
zip = { workspace = true }

# XLSX BOM export
rust_xlsxwriter = { workspace = true }

# In-app shell parsing.
clap = { workspace = true }
shlex = { workspace = true }

# HTTP client for the cuforge-services health poller — NATIVE ONLY.
# The browser demo (Phase B) doesn't poll a local server, so ureq
# (and its rustls dep tree) is gated out of wasm builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }

# WASM-only deps for the browser build (Phase A of develop/wasm-demo-plan.md).
# `getrandom` with the `js` feature forces transitive uses (egui, etc.) to
# pick the browser-RNG backend. The actual wasm entry-point deps
# (wasm-bindgen-futures, web-sys, console_error_panic_hook) get added when
# copperforge-web is stood up in Phase B.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Both 0.2 and 0.3 are in the dep tree (different majors coexist).
# Each major needs the browser-RNG feature enabled independently;
# the cfg in .cargo/config.toml only unlocks the 0.3 backend.
getrandom = { version = "0.2", features = ["js"] }
getrandom_v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }