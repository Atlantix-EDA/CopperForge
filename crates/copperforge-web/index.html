<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>CopperForge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            /* CopperForge dark green so the boot screen blends into the
               app's canvas once eframe takes over — no white flash. */
            background: #1a3d2e;
            color: #c0caf5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #the_canvas_id {
            width: 100%;
            height: 100%;
        }

        #loading_text {
            text-align: center;
        }

        #loading_text h1 {
            font-size: 2em;
            margin-bottom: 0.5em;
            color: #b87333; /* copper */
        }

        .spinner {
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(184, 115, 51, 0.25);
            border-top: 5px solid #b87333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="loading_text">
        <h1>CopperForge</h1>
        <div class="spinner"></div>
        <p>Loading WASM module...</p>
    </div>

    <canvas id="the_canvas_id"></canvas>

    <link data-trunk rel="rust" data-wasm-opt="z" />
</body>
</html>
