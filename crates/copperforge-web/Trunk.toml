[build]
target = "index.html"
release = false
filehash = false

[watch]
# Watch the web crate AND copperforge-core — almost all the rendering /
# 3D / panel code lives in core, so without watching it `trunk serve` would
# serve stale wasm after any core-only edit. Paths are relative to this
# Trunk.toml (crates/copperforge-web/).
paths = ["src", "index.html", "../copperforge-core/src"]
ignore = ["./dist"]

[serve]
address = "127.0.0.1"
port = 8080
open = true

# wasm-opt is run automatically by trunk on --release builds; the
# `data-wasm-opt="z"` attribute on the <link> tag in index.html selects
# size-aggressive optimisation. Do NOT set `wasm_opt = "z"` under
# `[tools]` — that field configures the *version tag* of wasm-opt to
# download, not the optimisation level.
