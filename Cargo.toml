


[workspace]
resolver = "2"
members = [
    "crates/copperforge-core",
    "crates/copperforge-web",
]

[package]
name = "copperforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "PCB release & manufacturing companion tool for KiCad"

[[bin]]
name = "copperforge"
path = "src/main.rs"

[dependencies]
copperforge-core = { path = "crates/copperforge-core" }
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
log.workspace = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.package]
version = "0.5.1"
edition = "2024"
authors = ["James Bonanno <atlantix-eda@proton.me>"]
repository = "https://github.com/Atlantix-EDA/CopperForge"
license = "MIT"

[workspace.dependencies]
egui = "0.33"
# eframe features: disable `accesskit` (~10 direct + ~30 transitive crates:
# accesskit_*, atspi, zbus, zvariant — screen-reader plumbing CopperForge
# doesn't target). Keep glow (default OpenGL backend), default_fonts, the
# Linux display servers (wayland + x11), and winit defaults.
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui-file-dialog = "0.12.0"

# Image and graphics handling
egui_extras = { version = "0.33", features = ["image"] } # For image loading and other utilities
# Only PNG decoding/encoding is needed — quadrant export writes PNG, About
# panel loads a PNG logo. Narrowing default-features off cuts JPEG/GIF/TIFF/
# BMP/ICO/WebP decoders (~25 transitive crates). Bumped to 0.25 to match
# the version egui_extras-0.33 resolves to internally so cargo unifies.
image = { version = "0.25", default-features = false, features = ["png"] }

# Gerber and PCB handling
gerber_viewer = "0.5.0"
gerber_types = { package = "gerber-types", version = "0.7.0" }
gerber_parser = "0.4.0"
lyon = "1"
nalgebra = "0.34"

# 3D renderer (Phase 1: glow-based axes gizmo; see develop/task3d-plan.md)
glow = "0.16"
egui_glow = { version = "0.33", default-features = false }
bytemuck = "1.23"

# Egui Mobius framework — fetched from the egui_mobius monorepo so a plain
# `cargo run` pulls it. For local co-development, override with a path via
# a (gitignored) .cargo/config.toml `paths` entry — see .cargo/config.toml.example.
egui_mobius_reactive = { git = "https://github.com/saturn77/egui_mobius", tag = "v0.4.0" }

# Citizen panel lifecycle (lives in the same egui_mobius monorepo).
# Note: egui_mobius v0.4.0 requires egui 0.34; gerber_viewer 0.5.0
# pins egui 0.33. Until one side rebases, citizen/lens integration in
# the wasm app is deferred — copperforge-web rolls its own dock + log.
egui_citizen = { git = "https://github.com/saturn77/egui_mobius", tag = "v0.4.0" }

# KiCad file parsing (BOM extraction from .kicad_pcb)
kiparse = { git = "https://github.com/Atlantix-EDA/atlantix-eda.git", package = "kiparse" }

# Logging and configuration
env_logger = "0.11.8"
log = "0.4"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.35.1"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10"
egui_dock = {version = "0.18.0", features=["serde"]}

regex = "1.10"
once_cell = "1.19"


# Project database (embedded pure-Rust KV store)
redb = "2.2"
bincode = "1.3"
thiserror = "1.0"

# Tree view
egui_ltreeview = "0.6.0"

# Release archives (gerber+drill zip)
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# XLSX BOM export
rust_xlsxwriter = "0.95"

# HTTP client for the cuforge-services health poller. Small blocking
# client — fine for the background-thread ping pattern; no async runtime.
ureq = { version = "2", features = ["json"] }

# In-app shell: argument parsing (clap) + quote-aware tokenization (shlex).
# `derive` pulls `clap_derive` so sub-commands can be declared inline;
# `std` is default. Colors are disabled explicitly at call time so we don't
# bleed ANSI into the shell's plain-text log.
clap = { version = "4", features = ["derive"] }
shlex = "1"
