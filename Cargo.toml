


[workspace]
resolver = "2"
members = [
    "crates/copperforge-core",
    "crates/copperforge-web",
    "crates/services",
]

[package]
name = "copperforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "PCB release & manufacturing companion tool for KiCad"

[[bin]]
name = "copperforge"
path = "src/main.rs"

[dependencies]
copperforge-core = { path = "crates/copperforge-core" }
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
log.workspace = true
clap.workspace = true
chrono.workspace = true
dirs.workspace = true
egui_mobius_reactive.workspace = true
# Decodes the embedded window-icon PNG at startup. Same pinned workspace
# version/features the rest of the tree already compiles — no new crates.
image.workspace = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# solidcraft-kernel (sibling clone, STEP import prototype) pins locally
# patched truck crates in its own workspace; patches only apply from the
# top-level workspace, so the same pins are replicated here. Only the STEP
# path pulls truck — nothing else in the tree resolves these.
[patch.crates-io]
truck-shapeops = { path = "../solidcraft/vendor/truck-shapeops" }
truck-stepio = { path = "../solidcraft/vendor/truck-stepio" }
truck-meshalgo = { path = "../solidcraft/vendor/truck-meshalgo" }
matext4cgmath = { path = "../solidcraft/vendor/matext4cgmath" }

[workspace.package]
# Version ledger — bump on every iteration (MAJOR.feature.fix).
# 0.8.0 release zips stamped with UTC time (<proj>_<rev>_DDMonYYYY_HHMMZ.zip);
#       same-day releases no longer collide. Dialog label updated to match.
# 0.8.1 3D gerber view recolored to match JLCPCB viewer: cooler saturated
#       mask/FR-4 greens, MASK_ALPHA 0.72→0.85 (kills gold bleed-through)
# 0.8.2 bottom-side mask/copper/silk now identical to top (debug tint removed)
# 0.9.0 solid-board 3D: opaque edge walls, inner copper no longer drawn (option
#       B — true boolean edge sections would need CSG); grazing-angle bleed
#       fixed by dropping polygon-offset slope factors (units-only bias)
# 0.9.1 JLC-style axes: full-span heavy lines through the board body (origin-
#       centered), occluded by the solid slab; labels track the new tips
version = "0.9.1"
edition = "2024"
authors = ["James Bonanno <atlantix-eda@proton.me>"]
repository = "https://github.com/Atlantix-EDA/CopperForge"
license = "MIT"

[workspace.dependencies]
egui = "0.34"
# eframe features: disable `accesskit` (~10 direct + ~30 transitive crates:
# accesskit_*, atspi, zbus, zvariant — screen-reader plumbing CopperForge
# doesn't target). Keep glow (default OpenGL backend), default_fonts, the
# Linux display servers (wayland + x11), and winit defaults.
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui-file-dialog = "0.13.0"

# Image and graphics handling
egui_extras = { version = "0.34", features = ["image"] } # For image loading and other utilities
# Only PNG decoding/encoding is needed — quadrant export writes PNG, About
# panel loads a PNG logo. Narrowing default-features off cuts JPEG/GIF/TIFF/
# BMP/ICO/WebP decoders (~25 transitive crates). Bumped to 0.25 to match
# the version egui_extras-0.33 resolves to internally so cargo unifies.
image = { version = "0.25", default-features = false, features = ["png"] }

# Gerber and PCB handling
gerber_viewer = "0.6.1"
gerber_types = { package = "gerber-types", version = "0.7.0" }
gerber_parser = "0.4.0"
lyon = "1"
nalgebra = "0.34"
# 2D polygon booleans (exposed copper = mask openings ∩ copper). Pure Rust,
# wasm32-clean. lyon only tessellates — it cannot clip.
i_overlay = { version = "9.1", default-features = false }

# 3D renderer (Phase 1: glow-based axes gizmo; see develop/task3d-plan.md)
glow = "0.17"
egui_glow = { version = "0.34", default-features = false }
bytemuck = "1.23"

# Egui Mobius framework — published on crates.io. Must resolve from the SAME
# source as egui_citizen below (both 0.6.0), or the graph carries two copies
# of egui_mobius_reactive and reactive types stop unifying across the citizen
# boundary. Using the registry means a bare clone builds with no sibling
# egui_mobius checkout.
egui_mobius_reactive = "0.6.0"

# Citizen panel lifecycle (from the egui_mobius monorepo, published on
# crates.io at 0.6.0). Targets egui 0.34 like gerber_viewer 0.6.1, so the
# whole tree unifies on 0.34.
egui_citizen = "0.6.0"

# KiCad file parsing (BOM extraction from .kicad_pcb)
kiparse = { git = "https://github.com/Atlantix-EDA/atlantix-eda.git", package = "kiparse" }

# Logging and configuration
env_logger = "0.11.8"
log = "0.4"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.35.1"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10"
egui_dock = {version = "0.19.1", features=["serde"]}

regex = "1.10"
once_cell = "1.19"


# Project database (embedded pure-Rust KV store)
redb = "2.2"
bincode = "1.3"
thiserror = "1.0"

# Tree view
egui_ltreeview = "0.7.0"

# Release archives (gerber+drill zip)
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# XLSX BOM export
rust_xlsxwriter = "0.95"

# HTTP clients. ureq is the small blocking client backing the existing
# native-only health poller — fine for the background-thread ping pattern.
# reqwest is the async client used by the new cuforge_api module
# (projects + releases REST surface) — same API on native and wasm32,
# multipart upload support, future-proof for auth/cookies/streaming.
ureq = { version = "2", features = ["json"] }
# `default-features = false` strips reqwest's hyper-based native backend
# (which doesn't compile on wasm32); per-target overrides in
# copperforge-core's Cargo.toml add the right backend per platform.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
# Async runtime for native callers of reqwest. Wasm uses the browser's
# event loop via wasm-bindgen-futures (separate dep on the web crate).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
# UUIDs in the wire format. Same crate as the server uses.
uuid = { version = "1", features = ["v4", "serde", "js"] }

# In-app shell: argument parsing (clap) + quote-aware tokenization (shlex).
# `derive` pulls `clap_derive` so sub-commands can be declared inline;
# `std` is default. Colors are disabled explicitly at call time so we don't
# bleed ANSI into the shell's plain-text log.
clap = { version = "4", features = ["derive"] }
shlex = "1"
