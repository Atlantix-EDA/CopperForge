


[workspace]
resolver = "2"
members = [
    "crates/copperforge-core",
]

[package]
name = "copperforge"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "copperforge"
path = "src/main.rs"

[dependencies]
copperforge-core = { path = "crates/copperforge-core" }
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
log.workspace = true

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["James Bonanno <atlantix-eda@proton.me>"]

[workspace.dependencies]
egui = "0.33"
eframe = "0.33"
egui-file-dialog = "0.12.0"

# Image and graphics handling
egui_extras = { version = "0.33", features = ["image"] } # For image loading and other utilities
image = "0.24" # For image loading

# Gerber and PCB handling
gerber_viewer = "0.5.0"
gerber_types = { package = "gerber-types", version = "0.7.0" }
gerber_parser = "0.4.0"
nalgebra = "0.34"

# Egui Mobius framework
egui_mobius_reactive = { version = "0.3.0-alpha.33" }

# Citizen panel lifecycle
egui_citizen = { path = "../egui-citizen/crates/egui_citizen" }

# KiCad file parsing (BOM extraction from .kicad_pcb)
kiparse = { git = "https://github.com/Atlantix-EDA/atlantix-eda.git", package = "kiparse" }

# Logging and configuration
env_logger = "0.11.8"
log = "0.4"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.35.1"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10"
local-ip-address = "0.6.5"
egui_dock = {version = "0.18.0", features=["serde"]}

regex = "1.10"
once_cell = "1.19"


# Project database
sled = "0.34"
bincode = "1.3"
thiserror = "1.0"

# Tree view
egui_ltreeview = "0.6.0"

# Release archives (gerber+drill zip)
zip = { version = "2.2", default-features = false, features = ["deflate"] }